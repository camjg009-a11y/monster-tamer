<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Tamer - JRPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #game-container {
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
        }
        
        #loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Monster Tamer...</div>
    <div id="game-container"></div>
    
    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Game Data -->
    <script src="data/monsters.js"></script>
    <script src="data/zones.js"></script>
    <script src="data/items.js"></script>
    
    <!-- Managers -->
    <script src="managers/GameState.js"></script>
    <script src="managers/BattleManager.js"></script>
    
    <!-- Scenes -->
    <script src="scenes/BootScene.js"></script>
    <script src="scenes/StarterScene.js"></script>
    <script src="scenes/WorldMapScene.js"></script>
    <script src="scenes/BattleScene.js"></script>
    <script src="scenes/MenuScene.js"></script>
    
    <!-- Main Game Configuration -->
    <script src="game.js"></script>
</body>
</html>
